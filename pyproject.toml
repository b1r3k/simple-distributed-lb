[tool.poetry]
name = "simple-distributed-lb"
version = "0.1.0"
description = ""
authors = ["Lukasz Jachym <lukasz.jachym@gmail.com>"]
readme = "README.md"
packages = [{include = "simple_distributed_lb"}]

[tool.poetry.dependencies]
python = "^3.11"
starlette = "^0.38.2"
uvicorn = "^0.30.6"
orjson = "^3.10.7"
pydantic = "^2.8.2"
pydantic-settings = "^2.4.0"
redis = "^5.0.8"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^7"
black = "^23.1.0"
pre-commit = "^3.1.0"
flake8 = "^6.0.0"
mypy = "^1.0.1"
isort = "^5.12.0"
pytest-timeout = "^2.3.1"
dnspython = "^2.7.0"
poetry-plugin-export = "^1.8.0"

[tool.poetry.scripts]
demo_upstream_server = 'simple_distributed_lb:demo_upstream_server.run'

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.black]
line-length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.isort]
profile = "black"
src_paths = ["simple_distributed_lb", "tests"]
